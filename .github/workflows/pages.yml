name: Publier le mini-site sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'livrables/mini-site-declic-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparer le mini-site
        uses: actions/upload-pages-artifact@v4
        with:
          path: livrables/mini-site-declic-web
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
